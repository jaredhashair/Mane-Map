name: Check canonical trailing slashes
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          FAILED=0
          for f in $(find . -name index.html -not -path "*/node_modules/*"); do
            u=$(grep -oP '(?<=rel="canonical" href=")[^"]*(?=")' "$f" || true)
            if [ -n "$u" ] && [[ "$u" != */ ]]; then
              echo "Missing trailing slash: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi